<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo · Yapılacaklar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- Giriş / Kayıt -->
  <main class="card auth-card" id="auth-screen">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <h1>Yapılacaklar</h1>
    </div>
    <p class="auth-subtitle" id="auth-subtitle">Devam etmek için giriş yap</p>

    <form id="auth-form" class="auth-form">
      <label class="field">
        <span>E-posta</span>
        <input type="email" id="auth-email" placeholder="ornek@eposta.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Şifre</span>
        <input type="password" id="auth-password" placeholder="En az 6 karakter" autocomplete="current-password" minlength="6" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Giriş Yap</button>
    </form>

    <p class="auth-error" id="auth-error"></p>

    <p class="auth-toggle-text">
      <span id="auth-toggle-label">Hesabın yok mu?</span>
      <button type="button" class="link-btn" id="auth-toggle">Kaydol</button>
    </p>
  </main>

  <!-- Uygulama -->
  <main class="card app-card" id="app-screen" hidden>
    <header class="topbar">
      <div class="brand brand-sm">
        <div class="brand-mark">✦</div>
        <h1>Yapılacaklar</h1>
      </div>
      <div class="user-box">
        <span class="avatar" id="user-avatar"></span>
        <button class="link-btn" id="logout-btn">Çıkış</button>
      </div>
    </header>

    <!-- Görev ekleme -->
    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Yeni görev yaz…" autocomplete="off">
      <button type="submit" class="btn btn-primary">Ekle</button>
    </form>

    <!-- Filtreler -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="completed">Tamamlanan</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="item-count">0 görev</span>
      <button class="link-btn" id="clear-completed">Tamamlananları temizle</button>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
